
name: security
on: [push, pull_request]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # GATE: Secret scanning
      - name: Secret scan (Gitleaks)
        env:
          GITLEAKS_CONFIG_TOML: |
            title = "Lab secret scanning"
            [extend]
            useDefault = true
            [[rules]]
            id = "lab-aws-key"
            description = "Detect fake AWS example key"
            regex = '''AKIA[A-Z0-9]{16}'''
            keywords = ["AKIA"]
        run: |
          docker run --rm \
            -e GITLEAKS_CONFIG_TOML \
            -v "${{ github.workspace }}:/repo" \
            zricethezav/gitleaks:latest \
            detect --source /repo --exit-code 1 --redact --verbose


      # REPORT: Static application security testing
      - name: SAST (Semgrep)
        if: ${{ !cancelled() }}
        run: |
          pip install semgrep
          semgrep scan --config auto

      # REPORT: Dependency scanning
      - name: Dependency scan (Trivy)
        if: ${{ !cancelled() }}
        run: |
          docker run -v "${{ github.workspace }}:/repo" aquasec/trivy:latest \
            fs --scanners vuln --exit-code 0 /repo
